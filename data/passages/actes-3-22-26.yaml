id: actes-3-22-26
corpus: bible
reference: Ac 3,22-26
texte: "Moïse a dit: Le Seigneur votre Dieu vous suscitera d'entre vos frères un prophète comme moi; vous l'écouterez dans tout ce qu'il vous dira, et quiconque n'écoutera pas ce prophète sera exterminé du milieu du peuple. Tous les prophètes qui ont successivement parlé, depuis Samuel, ont aussi annoncé ces jours-là. Vous êtes les fils des prophètes et de l'alliance que Dieu a traitée avec nos pères, en disant à Abraham: Toutes les familles de la terre seront bénies en ta postérité. C'est à vous premièrement que Dieu, ayant suscité son serviteur, l'a envoyé pour vous bénir, en détournant chacun de vous de ses iniquités."
traduction: Segond 1910
note: Pierre applique Dt 18,15-19 à Jésus. Voir aussi Ac 7,37 (Étienne).
