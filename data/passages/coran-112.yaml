id: coran-112
corpus: coran
reference: Coran 112,1-4
texte: "Dis : « Il est Allah, Unique. Allah, Le Seul à être imploré pour ce que nous désirons. Il n'a jamais engendré, n'a pas été engendré non plus. Et nul n'est égal à Lui. »"
traduction: Hamidullah (Complexe Roi Fahd)
themes:
