id: coran-3-39
corpus: coran
reference: Coran 3,39
texte: "Alors, les Anges l'appelèrent pendant que, debout, il priait dans le Sanctuaire : « Voilà qu'Allah t'annonce la naissance de Yaḥyâ, confirmateur d'une parole d'Allah. Il sera un chef, un chaste, un prophète et du nombre des gens de bien. »"
traduction: Hamidullah (Complexe Roi Fahd)
note: "Yaḥyâ (Jean-Baptiste) *confirme* une parole d’Allah, c’est-à-dire Jésus selon les exégètes : il n’est pas lui-même appelé « parole »."
themes:
  - jesus
