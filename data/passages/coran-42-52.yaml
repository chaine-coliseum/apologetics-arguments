id: coran-42-52
corpus: coran
reference: Coran 42,52
texte: Et c'est ainsi que Nous t'avons révélé un esprit [le Coran] provenant de Notre ordre. Tu n'avais aucune connaissance du Livre ni de la foi ; mais Nous en avons fait une lumière par laquelle Nous guidons qui Nous voulons parmi Nos serviteurs.
traduction: Hamidullah (Complexe Roi Fahd)
note: Le mot « Coran » est un ajout entre crochets du traducteur ; il n’est pas dans le texte arabe.
themes:
  - paraclet
