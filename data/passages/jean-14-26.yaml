id: jean-14-26
corpus: bible
reference: Jn 14,26
texte: Mais le consolateur, l'Esprit-Saint, que le Père enverra en mon nom, vous enseignera toutes choses, et vous rappellera tout ce que je vous ai dit.
traduction: Segond 1910
texte_original: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον, ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ὑμῖν ἐγώ.
note: "Identification explicite : le Paraclet est « l’Esprit, le Saint » (τὸ πνεῦμα τὸ ἅγιον), la même expression qu’en Mc 3,29, Lc 3,22, Ac 5,3, Ac 13,2, etc. Le mot ἅγιον est présent dans le Sinaïticus, l’Alexandrinus, le Vaticanus et le Papyrus 75."
themes:
  - paraclet
  - saint-esprit
