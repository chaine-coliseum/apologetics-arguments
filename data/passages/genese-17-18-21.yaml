id: genese-17-18-21
corpus: bible
reference: Gn 17,18-21
texte: "Et Abraham dit à Dieu: Oh! qu'Ismaël vive devant ta face! Dieu dit: Certainement Sara, ta femme, t'enfantera un fils; et tu l'appelleras du nom d'Isaac. J'établirai mon alliance avec lui comme une alliance perpétuelle pour sa postérité après lui. À l'égard d'Ismaël, je t'ai exaucé. Voici, je le bénirai, je le rendrai fécond, et je le multiplierai à l'infini; il engendrera douze princes, et je ferai de lui une grande nation. J'établirai mon alliance avec Isaac, que Sara t'enfantera à cette époque-ci de l'année prochaine."
traduction: Segond 1910
note: "Le vocabulaire de la bénédiction (féconder, multiplier « beaucoup » — me’od —, grande nation) est celui d’Israël en Égypte (Ex 1,7 ; Gn 47,27 ; Dt 26,5) : une prospérité démographique, sans mention de prophète ni de religion."
themes:
  - muhammad-dans-la-bible
