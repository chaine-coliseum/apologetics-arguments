id: papias-eusebe-he-3-39-15
corpus: patristique
reference: Papias, dans Eusèbe, Histoire ecclésiastique III,39,15-16
texte: Marc, qui était l'interprète de Pierre, a écrit avec exactitude, mais sans ordre, tout ce dont il se souvenait de ce qui avait été dit ou fait par le Seigneur. […] Matthieu réunit en langue hébraïque les logia, et chacun les interpréta comme il en était capable.
