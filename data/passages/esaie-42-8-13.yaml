id: esaie-42-8-13
corpus: bible
reference: Es 42,8-13
texte: Je suis l'Éternel, c'est là mon nom; Et je ne donnerai pas ma gloire à un autre, Ni mon honneur aux idoles. […] Chantez à l'Éternel un cantique nouveau, Chantez ses louanges aux extrémités de la terre, Vous qui voguez sur la mer et vous qui la peuplez, Îles et habitants des îles! Que le désert et ses villes élèvent la voix! Que les villages occupés par Kédar élèvent la voix! Que les habitants des rochers (Séla) tressaillent d'allégresse! […] L'Éternel s'avance comme un héros, Il excite son ardeur comme un homme de guerre;
traduction: Segond 1910
note: Kédar et Séla figurent dans une énumération de lieux (mer, îles, désert, montagnes) invités à louer l’Éternel.
themes:
  - muhammad-dans-la-bible
