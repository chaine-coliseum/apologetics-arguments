id: coran-61-6
corpus: coran
reference: Coran 61,6
texte: "Et quand Jésus fils de Marie dit : « Ô Enfants d'Israël, je suis vraiment le Messager d'Allah [envoyé] à vous, confirmateur de ce qui, dans la Thora, est antérieur à moi, et annonciateur d'un Messager à venir après moi, dont le nom sera « Ahmad ». » Puis quand celui-ci vint à eux avec des preuves évidentes, ils dirent : « C'est là une magie manifeste »."
traduction: Hamidullah (Complexe Roi Fahd)
note: "Base coranique de la revendication : « Ahmad » (le plus loué) rapproché du grec periklytos (« très renommé »)."
themes:
  - paraclet
