id: jean-16-12-15
corpus: bible
reference: Jn 16,12-15
texte: J'ai encore beaucoup de choses à vous dire, mais vous ne pouvez pas les porter maintenant. Quand le consolateur sera venu, l'Esprit de vérité, il vous conduira dans toute la vérité; car il ne parlera pas de lui-même, mais il dira tout ce qu'il aura entendu, et il vous annoncera les choses à venir. Il me glorifiera, parce qu'il prendra de ce qui est à moi, et vous l'annoncera. Tout ce que le Père a est à moi; c'est pourquoi j'ai dit qu'il prend de ce qui est à moi, et qu'il vous l'annoncera.
traduction: Segond 1910
themes:
  - paraclet
