id: deuteronome-13-1-3
corpus: bible
reference: Dt 13,1-3
texte: "S'il s'élève au milieu de toi un prophète ou un songeur qui t'annonce un signe ou un prodige, et qu'il y ait accomplissement du signe ou du prodige dont il t'a parlé en disant: Allons après d'autres dieux, - des dieux que tu ne connais point, - et servons-les! tu n'écouteras pas les paroles de ce prophète ou de ce songeur, car c'est l'Éternel, votre Dieu, qui vous met à l'épreuve pour savoir si vous aimez l'Éternel, votre Dieu, de tout votre cœur et de toute votre âme."
traduction: Segond 1910
note: "Numérotation hébraïque : Dt 13,2-4."
themes:
  - muhammad
