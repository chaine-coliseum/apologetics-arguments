id: actes-2-1-4
corpus: bible
reference: Ac 2,1-4
texte: Le jour de la Pentecôte, ils étaient tous ensemble dans le même lieu. Tout à coup il vint du ciel un bruit comme celui d'un vent impétueux, et il remplit toute la maison où ils étaient assis. Des langues, semblables à des langues de feu, leur apparurent, séparées les unes des autres, et se posèrent sur chacun d'eux. Et ils furent tous remplis du Saint-Esprit, et se mirent à parler en d'autres langues, selon que l'Esprit leur donnait de s'exprimer.
traduction: Segond 1910
themes:
  - paraclet
  - saint-esprit
