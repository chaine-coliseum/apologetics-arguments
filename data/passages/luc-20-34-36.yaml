id: luc-20-34-36
corpus: bible
reference: Lc 20,34-36
texte: "Jésus leur répondit: Les enfants de ce siècle prennent des femmes et des maris; mais ceux qui seront trouvés dignes d'avoir part au siècle à venir et à la résurrection des morts ne prendront ni femmes ni maris. Car ils ne pourront plus mourir, parce qu'ils seront semblables aux anges, et qu'ils seront fils de Dieu, étant fils de la résurrection."
traduction: Segond 1910
themes:
  - morale-islamique
