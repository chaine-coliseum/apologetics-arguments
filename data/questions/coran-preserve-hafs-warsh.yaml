id: coran-preserve-hafs-warsh
question: "43,19 se lit « serviteurs du Miséricordieux » chez Ḥafṣ et « auprès du Miséricordieux » chez Warsh : laquelle de ces deux lectures est la lettre préservée ?"
adressee_a: islam
objectif: Montrer que « pas une lettre n’a changé » est inexact.
themes:
  - coran
arguments:
  - coran-lectures-differentes
statut: ebauche
