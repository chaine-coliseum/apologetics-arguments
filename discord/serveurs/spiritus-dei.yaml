id: spiritus-dei
nom: SPIRITUS DEI 📚
plateforme: discord
discord_id: "1133756903386775622"
icone: images/serveurs/1133756903386775622.png
langue: fr
orientation: chretien
description: >-
  Serveur chrétien multiconfessionnel (catholiques, orthodoxes dont miaphysites, protestants) tourné vers l'apologétique : herméneutique et critique textuelle de la Bible, critique de l'islam, judaïsme, philosophie, logique et athéisme. Une catégorie « non-chrétien » accueille les visiteurs d'autres religions.
regles:
  - Respect obligatoire ; le serveur a pour but l'édification des chrétiens.
  - Pas de disputes intra-chrétiennes dans les salons ordinaires ; elles sont réservées au salon Disputatio (membres confirmés).
  - Les membres peu formés en Bible et en théologie sont invités à poser leurs questions plutôt qu'à débattre avec des musulmans.
  - Politique interdite (économie, sociologie…).
  - Messages en français.
themes: [ christianisme, islam, bible ]
