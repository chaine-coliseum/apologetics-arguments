id: 1-corinthiens-6-9-10
corpus: bible
reference: 1 Co 6,9-10
texte: "Ne savez-vous pas que les injustes n'hériteront point le royaume de Dieu? Ne vous y trompez pas: ni les impudiques, ni les idolâtres, ni les adultères, ni les efféminés, ni les infâmes, ni les voleurs, ni les cupides, ni les ivrognes, ni les outrageux, ni les ravisseurs, n'hériteront le royaume de Dieu."
traduction: Segond 1910
themes:
