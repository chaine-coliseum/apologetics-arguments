id: esaie-53-4-5
corpus: bible
reference: Es 53,4-5
texte: Cependant, ce sont nos souffrances qu'il a portées, C'est de nos douleurs qu'il s'est chargé; Et nous l'avons considéré comme puni, Frappé de Dieu, et humilié. Mais il était blessé pour nos péchés, Brisé pour nos iniquités; Le châtiment qui nous donne la paix est tombé sur lui, Et c'est par ses meurtrissures que nous sommes guéris.
traduction: Segond 1910
note: "Talmud, Sanhédrin 98b : le Messie, « le lépreux », porte nos souffrances (Es 53,4)."
themes:
  - crucifixion
