corpus: coran
reference: Coran 7,187
texte: "Ils t'interrogent sur l'Heure : « Quand arrivera-t-elle ? » Dis : « Seul mon Seigneur en a connaissance. Lui seul la manifestera en son temps. […] Elle ne viendra à vous que soudainement. »"
traduction: Hamidullah (Complexe Roi Fahd)
themes:
