id: coran-2-233
corpus: coran
reference: Coran 2,233
texte: Et les mères, qui veulent donner un allaitement complet, allaiteront leurs bébés deux ans complets. […] Et si, après s'être consultés, tous deux tombent d'accord pour décider le sevrage, nul grief à leur faire.
traduction: Hamidullah (Complexe Roi Fahd)
themes:
  - coran
