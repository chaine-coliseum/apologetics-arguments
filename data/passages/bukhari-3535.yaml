id: bukhari-3535
corpus: hadith
reference: Sahih al-Bukhari 3535
texte: "Mon exemple et celui des prophètes avant moi est celui d'un homme qui a bâti une maison et l'a embellie, sauf l'emplacement d'une brique dans un angle. Les gens en faisaient le tour, admiraient et disaient : « Si seulement cette brique était posée ! » Je suis cette brique, et je suis le sceau des prophètes."
note: Invoqué pour faire de Muhammad la « pierre angulaire » de Mt 21,42.
themes:
  - muhammad-dans-la-bible
