id: muslim-788a
corpus: hadith
reference: Sahih Muslim 788a
texte: "ʿÂʾisha rapporte que le Messager d'Allah entendit un homme réciter le Coran la nuit. Il dit : « Qu'Allah lui fasse miséricorde ; il m'a rappelé tel et tel verset que j'avais omis dans telle et telle sourate. »"
note: Voir aussi Sahih al-Bukhari 5038-5039 ; Muslim 789-791 (le Coran « s’échappe plus vite qu’un chameau entravé »).
themes:
  - coran
