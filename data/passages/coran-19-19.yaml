id: coran-19-19
corpus: coran
reference: Coran 19,19
texte: "Il dit : « Je suis en fait un Messager de ton Seigneur pour te faire don d'un fils pur. »"
traduction: Hamidullah (Complexe Roi Fahd)
note: Jésus est dit « pur » (zakiyyan) ; aucun verset ne lui demande d’implorer le pardon de ses péchés.
themes:
