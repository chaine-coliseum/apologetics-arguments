id: 2-pierre-3-15-16
corpus: bible
reference: 2 P 3,15-16
texte: Croyez que la patience de notre Seigneur est votre salut, comme notre bien-aimé frère Paul vous l'a aussi écrit, selon la sagesse qui lui a été donnée. C'est ce qu'il fait dans toutes les lettres, où il parle de ces choses, dans lesquelles il y a des points difficiles à comprendre, dont les personnes ignorantes et mal affermies tordent le sens, comme celui des autres Écritures, pour leur propre ruine.
traduction: Segond 1910
note: Pierre range les lettres de Paul parmi « les Écritures ».
themes:
  - bible
