id: actes-1-4-5
corpus: bible
reference: Ac 1,4-5
texte: Comme il se trouvait avec eux, il leur recommanda de ne pas s'éloigner de Jérusalem, mais d'attendre ce que le Père avait promis, ce que je vous ai annoncé, leur dit-il; car Jean a baptisé d'eau, mais vous, dans peu de jours, vous serez baptisés du Saint-Esprit.
traduction: Segond 1910
themes:
