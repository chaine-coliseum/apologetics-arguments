id: tirmidhi-1663
corpus: hadith
reference: Jâmiʿ at-Tirmidhî 1663
texte: "Il y a six choses auprès d'Allah pour le martyr : il est pardonné dès la première effusion de son sang, on lui montre sa place au Paradis, il est préservé du châtiment de la tombe […] et il est marié à soixante-douze épouses parmi les houris aux grands yeux."
note: Jugé ḥasan ṣaḥîḥ par at-Tirmidhî. Voir aussi Tirmidhî 2536 (« la force de cent hommes ») ; Ibn Mâja 4337 (chaîne jugée faible).
themes:
  - morale-islamique
