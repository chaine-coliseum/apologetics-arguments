id: coran-46-15
corpus: coran
reference: Coran 46,15
texte: "Et Nous avons enjoint à l'homme de la bonté envers ses père et mère : sa mère l'a péniblement porté et en a péniblement accouché ; et sa gestation et sevrage durent trente mois ; puis quand il atteint ses pleines forces et atteint quarante ans, il dit […]"
traduction: Hamidullah (Complexe Roi Fahd)
liens:
  - passage: coran-31-14
    type: parallele
    note: "Combinés : 30 mois de gestation et de sevrage, dont deux ans de sevrage."
    argument: dilemme-de-la-gestation
  - passage: coran-2-233
    type: parallele
    note: "Combinés : deux ans d’allaitement complet."
    argument: dilemme-de-la-gestation
themes:
