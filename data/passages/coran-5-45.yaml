id: coran-5-45
corpus: coran
reference: Coran 5,45
texte: Et Nous y avons prescrit pour eux vie pour vie, œil pour œil, nez pour nez, oreille pour oreille, dent pour dent. Les blessures tombent sous la loi du talion. Après, quiconque y renonce par charité, cela lui vaudra une expiation.
traduction: Hamidullah (Complexe Roi Fahd)
note: Voir aussi 2,178-179 ; 2,194. Comparer Mt 5,38-39.
themes:
  - morale-islamique
