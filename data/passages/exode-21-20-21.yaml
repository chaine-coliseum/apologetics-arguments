id: exode-21-20-21
corpus: bible
reference: Ex 21,20-21
texte: Si un homme frappe du bâton son esclave, homme ou femme, et que l'esclave meure sous sa main, le maître sera puni. Mais s'il survit un jour ou deux, le maître ne sera point puni; car c'est son argent.
traduction: Segond 1910
