id: coran-18-86
corpus: coran
reference: Coran 18,86
texte: Et quand il eut atteint le Couchant, il trouva que le soleil se couchait dans une source boueuse, et, auprès d'elle il trouva une peuplade.
traduction: Hamidullah (Complexe Roi Fahd)
note: "Récit de Dhû-l-Qarnayn (18,83-98) : le Couchant, le Levant, le barrage de fer et de cuivre contre Gog et Magog."
themes:
  - coran
