id: ibn-ezra-genese-16-12
corpus: juif
reference: Ibn Ezra sur Gn 16,12
texte: "Il sera comme un âne sauvage parmi les hommes : il surmontera les hommes. Cependant, à la fin, la main de tout homme sera contre lui. Cela est clairement indiqué dans le livre de Daniel, car la quatrième bête décrite là fait référence au royaume d'Ismaël."
themes:
  - muhammad-dans-la-bible
