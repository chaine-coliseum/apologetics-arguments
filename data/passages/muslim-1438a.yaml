id: muslim-1438a
corpus: hadith
reference: Sahih Muslim 1438a
texte: "Abû Saʿîd al-Khudrî : nous sommes partis avec le Messager d'Allah en expédition contre les Banû al-Muṣṭaliq et avons pris des captives parmi les meilleures des Arabes. Nous désirions les femmes, l'abstinence nous pesait, et nous voulions pratiquer le coït interrompu (ʿazl). Nous avons interrogé le Messager d'Allah, qui dit : « Il n'y a pas de mal à ne pas le faire… »"
note: La question porte sur la contraception (rançon des captives), non sur leur consentement. Voir aussi Abû Dâwûd 2155 (captives d’Awṭâs) et Coran 4,24 ; 23,5-6 ; 70,29-30.
themes:
  - morale-islamique
