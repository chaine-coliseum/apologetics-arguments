id: marc-11-12-14
corpus: bible
reference: Mc 11,12-14
texte: "Le lendemain, après qu'ils furent sortis de Béthanie, Jésus eut faim. Apercevant de loin un figuier qui avait des feuilles, il alla voir s'il y trouverait quelque chose; et, s'en étant approché, il ne trouva que des feuilles, car ce n'était pas la saison des figues. Prenant alors la parole, il lui dit: Que jamais personne ne mange de ton fruit! Et ses disciples l'entendirent."
traduction: Segond 1910
themes:
  - jesus
