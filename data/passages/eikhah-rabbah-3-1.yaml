id: eikhah-rabbah-3-1
corpus: juif
reference: Eikhah Rabbah 3,1
texte: "Au début, Il s'est révélé aux enfants d'Ésaü ; c'est ce qui est écrit : « L'Éternel est venu du Sinaï, il s'est levé sur eux de Séir » (Dt 33,2), mais ils ne l'ont pas acceptée. Il l'a offerte aux enfants d'Ismaël, mais ils ne l'ont pas acceptée ; c'est ce qui est écrit : « Il a resplendi de la montagne de Paran ». En fin de compte, Il l'a offerte à Israël et ils l'ont acceptée."
note: "Source : Sefaria."
