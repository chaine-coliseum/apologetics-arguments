id: tirmidhi-2653
corpus: hadith
reference: Jâmiʿ at-Tirmidhî 2653
texte: « La Torah et l'Injîl sont avec les Juifs et les Chrétiens, mais à quoi leur servent-ils ? »
note: Le Prophète, selon ce hadith, considère que Juifs et chrétiens possèdent la Torah et l’Évangile ; le reproche porte sur l’usage, non sur la perte du texte.
themes:
  - falsification-de-la-bible
