id: genese-21-10-13
corpus: bible
reference: Gn 21,10-13
texte: "et elle dit à Abraham: Chasse cette servante et son fils, car le fils de cette servante n'héritera pas avec mon fils, avec Isaac. Cette parole déplut fort aux yeux d'Abraham, à cause de son fils. Mais Dieu dit à Abraham: Que cela ne déplaise pas à tes yeux, à cause de l'enfant et de ta servante. Accorde à Sara tout ce qu'elle te demandera; car c'est d'Isaac que sortira une postérité qui te sera propre. Je ferai aussi une nation du fils de ta servante; car il est ta postérité."
traduction: Segond 1910
themes:
  - muhammad-dans-la-bible
