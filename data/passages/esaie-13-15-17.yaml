id: esaie-13-15-17
corpus: bible
reference: Es 13,15-17
texte: Tous ceux qu'on trouvera seront percés, Et tous ceux qu'on saisira tomberont par l'épée. Leurs enfants seront écrasés sous leurs yeux, Leurs maisons seront pillées, et leurs femmes violées. Voici, j'excite contre eux les Mèdes, Qui ne font point cas de l'argent, Et qui ne convoitent point l'or.
traduction: Segond 1910
note: "Oracle contre Babylone (Es 13,1) : description, au passif, des horreurs de la chute de l’empire, non commandement."
themes:
  - morale-biblique
