id: irenee-contre-heresies-3-1-1
corpus: patristique
reference: Irénée, Contre les hérésies III,1,1
texte: Matthieu publia chez les Hébreux, dans leur propre langue, une forme écrite de l'Évangile, à l'époque où Pierre et Paul évangélisaient Rome et y fondaient l'Église. Après la mort de ces derniers, Marc, le disciple et l'interprète de Pierre, nous transmit lui aussi par écrit ce que prêchait Pierre. De son côté, Luc, le compagnon de Paul, consigna en un livre l'Évangile que prêchait celui-ci. Puis Jean, le disciple du Seigneur, celui-là même qui avait reposé sur sa poitrine, publia lui aussi l'Évangile, tandis qu'il séjournait à Éphèse.
themes:
  - bible
