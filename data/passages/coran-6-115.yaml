id: coran-6-115
corpus: coran
reference: Coran 6,115
texte: Et la parole de ton Seigneur s'est accomplie en toute vérité et équité. Nul ne peut modifier Ses paroles. Il est l'Audient, l'Omniscient.
traduction: Hamidullah (Complexe Roi Fahd)
note: "Voir aussi 6,34 ; 10,64 ; 18,27. Argument retourné : si nul ne peut modifier les paroles d’Allah, la Torah et l’Évangile n’ont pu l’être."
liens:
