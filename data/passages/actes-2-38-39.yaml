id: actes-2-38-39
corpus: bible
reference: Ac 2,38-39
texte: "Pierre leur dit: Repentez-vous, et que chacun de vous soit baptisé au nom de Jésus-Christ, pour le pardon de vos péchés; et vous recevrez le don du Saint-Esprit. Car la promesse est pour vous, pour vos enfants, et pour tous ceux qui sont au loin, en aussi grand nombre que le Seigneur notre Dieu les appellera."
traduction: Segond 1910
themes:
  - paraclet
  - saint-esprit
