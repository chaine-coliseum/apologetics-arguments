id: coran-4-171
corpus: coran
reference: Coran 4,171
texte: Ô gens du Livre, n'exagérez pas dans votre religion, et ne dites d'Allah que la vérité. Le Messie Jésus, fils de Marie, n'est qu'un Messager d'Allah, Sa parole qu'Il envoya à Marie, et un souffle (de vie) venant de Lui. Croyez donc en Allah et en Ses messagers. Et ne dites pas « Trois ». Cessez ! Ce sera meilleur pour vous. Allah n'est qu'un Dieu unique. Il est trop glorieux pour avoir un enfant.
traduction: Hamidullah (Complexe Roi Fahd)
note: Jésus y est appelé « Sa parole » (kalimatuhu, défini par le pronom) et « un esprit venant de Lui » (rûḥun minhu).
themes:
  - jesus
  - trinite
