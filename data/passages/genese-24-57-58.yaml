id: genese-24-57-58
corpus: bible
reference: Gn 24,57-58
texte: "Alors ils répondirent: Appelons la jeune fille et consultons-la. Ils appelèrent donc Rebecca, et lui dirent: Veux-tu aller avec cet homme? Elle répondit: J'irai."
traduction: Segond 1910
note: Le consentement de Rébecca est demandé.
themes:
  - morale-biblique
