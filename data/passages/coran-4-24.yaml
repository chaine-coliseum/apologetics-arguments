id: coran-4-24
corpus: coran
reference: Coran 4,24
texte: Et parmi les femmes, les dames (qui ont un mari), sauf si elles sont vos esclaves en toute propriété. Prescription d'Allah sur vous !
traduction: Hamidullah (Complexe Roi Fahd)
note: Selon Abû Dâwûd 2155 et les tafsîrs, révélé à propos des captives d’Awṭâs dont les maris étaient vivants.
themes:
  - morale-islamique
