id: captives-consentement
question: Dans Muslim 1438a, les compagnons interrogent le Prophète sur la contraception avec les captives. Où leur demande-t-on leur consentement ?
adressee_a: islam
objectif: Mettre en évidence l’absence de consentement dans le droit des captives.
