id: zacharie-12-10
corpus: bible
reference: Za 12,10
texte: Alors je répandrai sur la maison de David et sur les habitants de Jérusalem un esprit de grâce et de supplication, Et ils tourneront les regards vers moi, celui qu'ils ont percé. Ils pleureront sur lui comme on pleure sur un fils unique,
traduction: Segond 1910
note: "Talmud, Soukka 52a : appliqué au Messie fils de Joseph mis à mort."
themes:
  - crucifixion
