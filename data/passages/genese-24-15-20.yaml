id: genese-24-15-20
corpus: bible
reference: Gn 24,15-20
texte: "Il n'avait pas encore fini de parler que sortit, sa cruche sur l'épaule, Rebecca […]. C'était une jeune fille très belle de figure; elle était vierge, et aucun homme ne l'avait connue. Elle descendit à la source, remplit sa cruche, et remonta. […] Quand elle eut achevé de lui donner à boire, elle dit: Je puiserai aussi pour tes chameaux, jusqu'à ce qu'ils aient assez bu."
traduction: Segond 1910
themes:
  - morale-biblique
