id: coran-5-46-47
corpus: coran
reference: Coran 5,46-47
texte: Et Nous avons envoyé après eux Jésus, fils de Marie, pour confirmer ce qu'il y avait dans la Thora avant lui. Et Nous lui avons donné l'Évangile, où il y a guide et lumière, pour confirmer ce qu'il y avait dans la Thora avant lui, et un guide et une exhortation pour les pieux. Que les gens de l'Évangile jugent d'après ce qu'Allah y a fait descendre. Ceux qui ne jugent pas d'après ce qu'Allah a fait descendre, ceux-là sont les pervers.
traduction: Hamidullah (Complexe Roi Fahd)
themes:
  - falsification-de-la-bible
