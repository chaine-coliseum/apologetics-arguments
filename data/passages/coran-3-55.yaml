id: coran-3-55
corpus: coran
reference: Coran 3,55
texte: "(Rappelle-toi) quand Allah dit : « Ô Jésus, certes, Je vais mettre fin à ta vie terrestre (mutawaffîka), t'élever vers Moi, te débarrasser de ceux qui n'ont pas cru et mettre jusqu'au Jour de la Résurrection ceux qui te suivent au-dessus de ceux qui ne croient pas. »"
traduction: Hamidullah (Complexe Roi Fahd)
note: "Ibn ʿAbbâs (cité par al-Bukhârî, Kitâb at-tafsîr) : mutawaffîka = « je vais te faire mourir »."
themes:
  - crucifixion
