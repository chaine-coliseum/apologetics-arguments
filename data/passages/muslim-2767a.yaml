id: muslim-2767a
corpus: hadith
reference: Sahih Muslim 2767a
texte: "Le Jour de la Résurrection, Allah remettra à chaque musulman un juif ou un chrétien et dira : « Voici ta rançon (fikâk) du Feu. »"
note: "Voir aussi Muslim 2767d : des musulmans aux péchés « lourds comme des montagnes » sont pardonnés et ces péchés sont placés sur les juifs et les chrétiens."
themes:
  - jesus
