id: apocalypse-1-17-18
corpus: bible
reference: Ap 1,17-18
texte: "Quand je le vis, je tombai à ses pieds comme mort. Il posa sur moi sa main droite en disant: Ne crains point! Je suis le premier et le dernier, et le vivant. J'étais mort; et voici, je suis vivant aux siècles des siècles. Je tiens les clefs de la mort et du séjour des morts."
traduction: Segond 1910
themes:
  - crucifixion
