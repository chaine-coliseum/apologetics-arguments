id: deuteronome-33-2
corpus: bible
reference: Dt 33,2
texte: "Il dit: L'Éternel est venu du Sinaï, Il s'est levé sur eux de Séir, Il a resplendi de la montagne de Paran, Et il est sorti du milieu des saintes myriades: Il leur a de sa droite envoyé le feu de la loi."
traduction: Segond 1910
note: Les verbes sont au passé (théophanie du don de la Loi). Paran désigne un désert du Sinaï traversé par Israël (Nb 10,12 ; 12,16 ; 13,3).
themes:
  - muhammad-dans-la-bible
