id: esaie-5-1-7
corpus: bible
reference: Es 5,1-7
texte: Je chanterai à mon bien-aimé Le cantique de mon bien-aimé sur sa vigne. Mon bien-aimé avait une vigne, Sur un coteau fertile. Il en remua le sol, ôta les pierres, et y mit un plant délicieux; Il bâtit une tour au milieu d'elle, Et il y creusa aussi une cuve. […] La vigne de l'Éternel des armées, c'est la maison d'Israël.
traduction: Segond 1910
note: "Arrière-plan de la parabole. Tosefta Soukka 3 : la tour est le Temple, le pressoir l’autel."
themes:
  - muhammad-dans-la-bible
