id: bukhari-5133
corpus: hadith
reference: Sahih al-Bukhari 5133
texte: "ʿÂʾisha : le Prophète l'épousa lorsqu'elle avait six ans et consomma le mariage lorsqu'elle avait neuf ans, et elle resta avec lui neuf ans."
note: Voir aussi Muslim 1422 ; Abû Dâwûd 4933 (« j’avais mes poupées avec moi ») ; Bukhari 6130 (jeux de poupées).
themes:
  - morale-islamique
