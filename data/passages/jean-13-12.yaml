id: jean-13-12
corpus: bible
reference: Jn 13,12
texte: "Après qu'il leur eut lavé les pieds, et qu'il eut pris ses vêtements, il se remit à table, et leur dit: Comprenez-vous ce que je vous ai fait ?"
traduction: Segond 1910
note: "Début du discours d’adieu : le « vous » désigne ceux dont Jésus vient de laver les pieds, les apôtres."
