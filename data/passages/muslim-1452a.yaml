id: muslim-1452a
corpus: hadith
reference: Sahih Muslim 1452a
texte: "ʿÂʾisha rapporte : il avait été révélé dans le Coran que dix allaitements bien établis rendent [le mariage] illicite ; puis cela fut abrogé par cinq allaitements bien établis. Le Messager d'Allah mourut alors que ces [paroles] faisaient partie de ce qui était récité du Coran."
note: Le verset des « cinq allaitements », récité à la mort de Muhammad selon ce hadith, ne figure pas dans le Coran actuel.
themes:
  - coran
