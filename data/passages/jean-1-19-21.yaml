id: jean-1-19-21
corpus: bible
reference: Jn 1,19-21
texte: "Voici le témoignage de Jean, lorsque les Juifs envoyèrent de Jérusalem des sacrificateurs et des Lévites, pour lui demander: Toi, qui es-tu? Il déclara, et ne le nia point, il déclara qu'il n'était pas le Christ. Et ils lui demandèrent: Quoi donc? es-tu Élie? Et il dit: Je ne le suis point. Es-tu le prophète? Et il répondit: Non."
traduction: Segond 1910
