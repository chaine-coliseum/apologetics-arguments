id: coran-4-157-158
corpus: coran
reference: Coran 4,157-158
texte: "et à cause de leur parole : « Nous avons vraiment tué le Christ, Jésus, fils de Marie, le Messager d'Allah »… Or, ils ne l'ont ni tué ni crucifié ; mais ce n'était qu'un faux semblant ! Et ceux qui ont discuté sur son sujet sont vraiment dans l'incertitude : ils n'en ont aucune connaissance certaine, ils ne font que suivre des conjectures et ils ne l'ont certainement pas tué ; mais Allah l'a élevé vers Lui. Et Allah est Puissant et Sage."
traduction: Hamidullah (Complexe Roi Fahd)
note: Sourate An-Nisâʾ (4).
themes:
  - crucifixion
