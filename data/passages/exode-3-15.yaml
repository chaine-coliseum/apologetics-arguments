corpus: bible
reference: Ex 3,15
texte: "Dieu dit encore à Moïse: Tu parleras ainsi aux enfants d'Israël: L'Éternel (YHWH), le Dieu de vos pères, le Dieu d'Abraham, le Dieu d'Isaac et le Dieu de Jacob, m'envoie vers vous. Voilà mon nom pour l'éternité, voilà mon nom de génération en génération."
