id: matthieu-11-2-6
corpus: bible
reference: Mt 11,2-6
texte: "Jean, ayant entendu parler dans sa prison des œuvres du Christ, lui fit dire par ses disciples: Es-tu celui qui doit venir, ou devons-nous en attendre un autre? Jésus leur répondit: Allez rapporter à Jean ce que vous entendez et ce que vous voyez: les aveugles voient, les boiteux marchent, les lépreux sont purifiés, les sourds entendent, les morts ressuscitent, et la bonne nouvelle est annoncée aux pauvres. Heureux celui pour qui je ne serai pas une occasion de chute!"
traduction: Segond 1910
themes:
  - jesus
