id: exode-22-15-16
corpus: bible
reference: Ex 22,15-16
texte: Si un homme séduit une vierge qui n'est point fiancée, et qu'il couche avec elle, il paiera sa dot et la prendra pour femme. Si le père refuse de la lui accorder, il paiera en argent la valeur de la dot des vierges.
traduction: Segond 1910
note: "Numérotation hébraïque : 22,16-17."
