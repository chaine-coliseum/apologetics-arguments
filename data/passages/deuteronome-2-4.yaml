id: deuteronome-2-4
corpus: bible
reference: Dt 2,4
texte: "Donne cet ordre au peuple: Vous allez passer à la frontière de vos frères, les enfants d'Ésaü, qui habitent en Séir. Ils vous craindront; mais soyez bien sur vos gardes."
traduction: Segond 1910
note: Les Édomites sont appelés « frères » d’Israël (voir aussi Nb 20,14 ; Dt 23,7) ; aucun verset ne le dit des Ismaélites.
themes:
  - muhammad-dans-la-bible
