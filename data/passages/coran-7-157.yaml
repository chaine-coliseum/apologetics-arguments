id: coran-7-157
corpus: coran
reference: Coran 7,157
texte: Ceux qui suivent le Messager, le Prophète illettré qu'ils trouvent écrit (mentionné) chez eux dans la Thora et l'Évangile. […] Ceux qui croiront en lui, le soutiendront, lui porteront secours et suivront la lumière descendue avec lui ; ceux-là seront les gagnants.
traduction: Hamidullah (Complexe Roi Fahd)
note: Le Coran affirme que Muhammad est mentionné dans la Torah et l’Évangile. On lui « porte secours », alors que le Paraclet est celui qui secourt.
themes:
  - muhammad-dans-la-bible
