id: bukhari-4838
corpus: hadith
reference: Sahih al-Bukhari 4838 (et 2125)
texte: "ʿAbd Allâh ibn ʿAmr : ce verset du Coran, « Nous t'avons envoyé comme témoin, annonciateur et avertisseur » (48,8), se trouve dans la Torah ainsi : « … et comme protecteur des illettrés. Tu es Mon serviteur et Mon messager ; Je t'ai nommé al-Mutawakkil. Tu n'es ni dur, ni grossier, ni criard dans les marchés. Tu ne rends pas le mal pour le mal, mais tu pardonnes. Allah ne le rappellera pas à Lui avant d'avoir redressé par lui une nation tordue… par quoi s'ouvriront des yeux aveugles, des oreilles sourdes et des cœurs voilés. »"
note: "Paraphrase d’Es 42 attribuée à un compagnon : c’est son opinion, non une parole du Prophète."
