id: 1-jean-2-1-2
corpus: bible
reference: 1 Jn 2,1-2
texte: Mes petits enfants, je vous écris ces choses, afin que vous ne péchiez point. Et si quelqu'un a péché, nous avons un avocat auprès du Père, Jésus-Christ le juste. Il est lui-même une victime expiatoire pour nos péchés, non seulement pour les nôtres, mais aussi pour ceux du monde entier.
traduction: Segond 1910
note: Jésus est « paraclet » (avocat) en vertu de son sacrifice expiatoire (v. 2, introduit par un καί explicatif), non en tant que prophète.
themes:
  - paraclet
