id: esther-4-16-5-1
corpus: bible
reference: Est 4,16 ; 5,1
texte: Va, rassemble tous les Juifs qui se trouvent à Suse, et jeûnez pour moi, sans manger ni boire pendant trois jours, ni la nuit ni le jour. […] Le troisième jour, Esther mit ses vêtements royaux, et se présenta dans la cour intérieure de la maison du roi.
traduction: Segond 1910
note: « Trois jours et trois nuits » aboutit « le troisième jour » (cf. 1 S 30,12-13).
themes:
  - contradictions-bibliques
