id: jean-14-16-17
corpus: bible
reference: Jn 14,16-17
texte: Et moi, je prierai le Père, et il vous donnera un autre consolateur, afin qu'il demeure éternellement avec vous, l'Esprit de vérité, que le monde ne peut recevoir, parce qu'il ne le voit point et ne le connaît point; mais vous, vous le connaissez, car il demeure avec vous, et il sera en vous.
traduction: Segond 1910
texte_original: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ᾖ μεθ’ ὑμῶν εἰς τὸν αἰῶνα, τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ γινώσκει· ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ἔσται.
note: "μένει (« il demeure ») est au présent : le Paraclet est déjà auprès des apôtres au moment du discours. λαβεῖν (« recevoir ») et ἐν ὑμῖν (« en vous ») décrivent un esprit reçu intérieurement."
themes:
  - paraclet
