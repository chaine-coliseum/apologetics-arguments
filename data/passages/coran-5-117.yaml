id: coran-5-117
corpus: coran
reference: Coran 5,117
texte: "Je ne leur ai dit que ce Tu m'avais commandé, (à savoir) : « Adorez Allah, mon Seigneur et votre Seigneur ». Et je fus témoin contre eux aussi longtemps que je fus parmi eux. Puis quand Tu m'as rappelé (tawaffaytanî), c'est Toi qui fus leur observateur attentif."
traduction: Hamidullah (Complexe Roi Fahd)
themes:
  - crucifixion
