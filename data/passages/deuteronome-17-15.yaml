id: deuteronome-17-15
corpus: bible
reference: Dt 17,15
texte: tu mettras sur toi un roi que choisira l'Éternel, ton Dieu, tu prendras un roi du milieu de tes frères, tu ne pourras pas te donner un étranger, qui ne soit pas ton frère.
traduction: Segond 1910
note: Même expression qu’en Dt 18,15.18 ; accomplie par Saül, un Benjaminite (1 S 10,17-24). Aucun roi d’Israël ne fut ismaélite.
themes:
