id: coran-5-32
corpus: coran
reference: Coran 5,32
texte: C'est pourquoi Nous avons prescrit pour les Enfants d'Israël que quiconque tuerait une personne non coupable d'un meurtre ou d'une corruption sur la terre, c'est comme s'il avait tué tous les hommes. Et quiconque lui fait don de la vie, c'est comme s'il faisait don de la vie à tous les hommes.
traduction: Hamidullah (Complexe Roi Fahd)
note: "« Nous avons écrit / prescrit » (katabnâ ʿalâ) : formule employée pour les révélations antérieures (7,145 ; 21,105)."
themes:
  - coran
