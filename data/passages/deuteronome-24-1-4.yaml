id: deuteronome-24-1-4
corpus: bible
reference: Dt 24,1-4
texte: Lorsqu'un homme aura pris et épousé une femme qui viendrait à ne pas trouver grâce à ses yeux, parce qu'il a découvert en elle quelque chose de honteux, il écrira pour elle une lettre de divorce, et, après la lui avoir remise en main, il la renverra de sa maison. Elle sortira de chez lui, s'en ira, et pourra devenir la femme d'un autre homme. […] alors le premier mari qui l'avait renvoyée ne pourra pas la reprendre pour femme après qu'elle a été souillée, car c'est une abomination devant l'Éternel.
traduction: Segond 1910
note: "Au v. 2, l’hébreu et la Septante (καὶ ἀπελθοῦσα γένηται ἀνδρὶ ἑτέρῳ) n’ont pas de verbe « pouvoir » : « si, étant partie, elle est devenue la femme d’un autre » (cf. Martin, Bible de Jérusalem). C’est une casuistique, non une permission."
themes:
  - sacrements
