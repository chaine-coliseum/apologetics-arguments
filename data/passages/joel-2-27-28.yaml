id: joel-2-27-28
corpus: bible
reference: Jl 2,27-28
texte: Et vous saurez que je suis au milieu d'Israël, Que je suis l'Éternel, votre Dieu, et qu'il n'y en a point d'autre, Et mon peuple ne sera plus jamais dans la confusion. Après cela, je répandrai mon esprit sur toute chair; Vos fils et vos filles prophétiseront, vos vieillards auront des songes, Et vos jeunes gens des visions.
traduction: Segond 1910
note: Cité par Pierre en Ac 2,16-21 comme accompli à la Pentecôte.
themes:
  - saint-esprit
