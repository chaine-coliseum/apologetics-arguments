id: coran-21-91
corpus: coran
reference: Coran 21,91
texte: Et celle qui avait préservé sa chasteté ! Nous insufflâmes en elle un souffle venant de Nous et fîmes d'elle ainsi que de son fils, un signe pour l'univers (li-l-ʿâlamîn).
traduction: Hamidullah (Complexe Roi Fahd)
note: "Voir aussi 19,21 : « un signe pour les gens »."
themes:
  - jesus
