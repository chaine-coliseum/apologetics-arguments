id: bukhari-4428
corpus: hadith
reference: Sahih al-Bukhari 4428
texte: "ʿÂʾisha : pendant la maladie dont il mourut, le Prophète disait : « Ô ʿÂʾisha ! Je ressens encore la douleur causée par la nourriture que j'ai mangée à Khaybar, et en ce moment je sens comme si mon aorte était tranchée par ce poison. »"
note: Voir aussi Abi Dawud 4512-4513 (la Juive de Khaybar et le mouton empoisonné).
themes:
  - muhammad
