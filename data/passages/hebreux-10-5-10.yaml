id: hebreux-10-5-10
corpus: bible
reference: He 10,5-10
texte: "C'est pourquoi Christ, entrant dans le monde, dit: Tu n'as voulu ni sacrifice ni offrande, Mais tu m'as formé un corps; […] Alors j'ai dit: Voici, je viens […] Pour faire, ô Dieu, ta volonté. […] C'est en vertu de cette volonté que nous sommes sanctifiés, par l'offrande du corps de Jésus-Christ, une fois pour toutes."
traduction: Segond 1910
themes:
  - crucifixion
