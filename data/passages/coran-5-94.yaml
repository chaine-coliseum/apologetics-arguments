id: coran-5-94
corpus: coran
reference: Coran 5,94
texte: Ô les croyants ! Allah va certainement vous éprouver par quelque gibier à portée de vos mains et de vos lances, afin qu'Allah sache celui qui Le craint en secret.
traduction: Hamidullah (Complexe Roi Fahd)
note: Allah « éprouve pour savoir » sans que cela nie Son omniscience.
themes:
  - jesus
