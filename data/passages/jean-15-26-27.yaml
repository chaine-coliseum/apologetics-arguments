id: jean-15-26-27
corpus: bible
reference: Jn 15,26-27
texte: Quand sera venu le consolateur, que je vous enverrai de la part du Père, l'Esprit de vérité, qui vient du Père, il rendra témoignage de moi; et vous aussi, vous rendrez témoignage, parce que vous êtes avec moi dès le commencement.
traduction: Segond 1910
texte_original: Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
note: C’est Jésus qui envoie le Paraclet ; celui-ci « sort » (ἐκπορεύεται) d’auprès (παρά) du Père.
themes:
  - paraclet
