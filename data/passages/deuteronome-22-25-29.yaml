id: deuteronome-22-25-29
corpus: bible
reference: Dt 22,25-29
texte: Mais si c'est dans les champs que cet homme rencontre la jeune fille fiancée, lui fait violence et couche avec elle, l'homme qui aura couché avec elle sera seul puni de mort. Tu ne feras rien à la jeune fille; elle n'est point coupable d'un crime digne de mort, car il en est de ce cas comme de celui où un homme se jette sur son prochain et lui ôte la vie. La jeune fille fiancée, que cet homme a rencontrée dans les champs, a pu crier sans qu'il y ait eu personne pour la secourir. Si un homme rencontre une jeune fille vierge non fiancée, lui fait violence et couche avec elle, et qu'on vienne à les surprendre, l'homme qui aura couché avec elle donnera au père de la jeune fille cinquante sicles d'argent; et, parce qu'il l'a déshonorée, il la prendra pour femme, et ne pourra pas la renvoyer, tant qu'il vivra.
traduction: Segond 1910
note: "v. 25 : ḥâzaq (saisir de force) ; v. 28 : tâpas (saisir, prendre). Le parallèle d’Ex 22,15-16 (séduction) prévoit le refus du père ; le Talmud (Ketoubot 39b) étend le droit de refus à la jeune fille et à son père, a fortiori en cas de viol."
themes:
  - morale-biblique
