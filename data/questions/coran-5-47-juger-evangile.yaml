id: coran-5-47-juger-evangile
question: Coran 5,47 ordonne aux gens de l’Évangile de juger d’après l’Évangile. Comment le faire si l’Évangile a disparu ?
adressee_a: islam
objectif: Montrer que le Coran présuppose un Évangile disponible.
themes:
  - falsification-de-la-bible
arguments:
  - coran-confirme-la-bible
passages:
  - coran-5-46-47
statut: ebauche
