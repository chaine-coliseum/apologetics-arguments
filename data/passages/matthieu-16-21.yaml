id: matthieu-16-21
corpus: bible
reference: Mt 16,21
texte: Dès lors Jésus commença à faire connaître à ses disciples qu'il fallait qu'il allât à Jérusalem, qu'il souffrît beaucoup de la part des anciens, des principaux sacrificateurs et des scribes, qu'il fût mis à mort, et qu'il ressuscitât le troisième jour.
traduction: Segond 1910
note: "Annonces parallèles : Mc 8,31-33 ; Lc 9,22 ; Mt 17,22-23 ; Mc 9,30-32 ; Lc 9,44-45 ; Mt 20,17-19 ; Mc 10,32-34 ; Lc 18,31-33 ; Mt 12,39-40 ; Jn 2,19-22."
themes:
  - crucifixion
