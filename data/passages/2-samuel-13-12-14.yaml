id: 2-samuel-13-12-14
corpus: bible
reference: 2 S 13,12-14
texte: "Elle lui répondit: Non, mon frère, ne me déshonore pas, car on n'agit point ainsi en Israël; ne commets pas cette infamie. Où irais-je, moi, avec ma honte? Et toi, tu serais comme l'un des infâmes en Israël. […] Mais il ne voulut pas l'écouter; il lui fit violence, la déshonora et coucha avec elle."
traduction: Segond 1910
note: Le viol de Tamar est qualifié d’« infamie » (nebalah) ; Absalom venge sa sœur.
themes:
  - morale-biblique
