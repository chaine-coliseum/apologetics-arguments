reference: Targum Jonathan sur Es 42,1
texte: Voici mon serviteur, le Messie, que je rapproche, mon élu, en qui ma Memra prend plaisir ; je placerai sur lui mon esprit saint, et il révélera ma loi aux nations.
note: "Traduction d’après S. H. Levy, The Messiah: An Aramaic Interpretation, 1974, p. 59-60. Voir aussi Midrash Tehillim 2,9 et 43,5."
