id: bukhari-3
corpus: hadith
reference: Sahih al-Bukhari 3
texte: "Khadîja l'emmena chez son cousin Waraqa ibn Nawfal, qui s'était fait chrétien avant l'islam et écrivait en caractères hébreux ; il écrivait de l'Évangile en hébreu autant qu'Allah voulait. […] Waraqa dit : « C'est le Nâmûs qu'Allah a envoyé à Moïse. »"
note: "Muslim 160a : « il écrivait l’Évangile en arabe »."
themes:
  - falsification-de-la-bible
  - tradition-islamique
