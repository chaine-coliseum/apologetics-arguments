id: coran-3-45
corpus: coran
reference: Coran 3,45
texte: "(Rappelle-toi) quand les Anges dirent : « Ô Marie, voilà qu'Allah t'annonce une parole de Sa part : son nom sera « al-Masîh », « ʿIssa », fils de Marie, illustre ici-bas comme dans l'au-delà, et l'un des rapprochés d'Allah. »"
traduction: Hamidullah (Complexe Roi Fahd)
