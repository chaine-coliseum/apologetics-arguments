corpus: bible
reference: Gn 49,10-11
texte: Le sceptre ne s'éloignera point de Juda, Ni le bâton souverain d'entre ses pieds, Jusqu'à ce que vienne le Schilo, Et que les peuples lui obéissent. Il attache à la vigne son âne, Et au meilleur cep le petit de son ânesse;
traduction: Segond 1910
note: "Le Schilo vient de Juda. Qumrân (4Q252) : « jusqu’à ce que vienne le Messie de justice, le Germe de David ». Lien avec Za 9,9 et l’ânon de Mc 11,2."
