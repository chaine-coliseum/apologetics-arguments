    type: tension
    note: Paroles immuables et abrogation.
    argument: abrogation-contredit-l-immutabilite
  - passage: coran-2-79
    type: tension
    note: Nul ne change les paroles d’Allah, mais des livres auraient été falsifiés.
    argument: coran-confirme-la-bible
themes:
