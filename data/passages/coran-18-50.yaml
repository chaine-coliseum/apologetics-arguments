id: coran-18-50
corpus: coran
reference: Coran 18,50
texte: "Et lorsque Nous dîmes aux Anges : « Prosternez-vous devant Adam », ils se prosternèrent, excepté Iblis, qui était du nombre des djinns et qui se révolta contre le commandement de son Seigneur."
traduction: Hamidullah (Complexe Roi Fahd)
