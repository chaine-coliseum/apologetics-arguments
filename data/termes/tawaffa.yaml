id: tawaffa
terme: Tawaffâ
translitteration: tawaffâ / mutawaffîka
langue: arabe
definition: Verbe employé pour Jésus en 3,55 et 5,117 ; dans ses autres emplois coraniques, il signifie « faire mourir » ou « reprendre l’âme ».
arguments:
  - tawaffa-signifie-mourir
passages:
  - coran-3-55
  - coran-5-117
