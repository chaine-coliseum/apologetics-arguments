id: esaie-11-1-2
corpus: bible
reference: Es 11,1-2
texte: "Puis un rameau sortira du tronc d'Isaï, Et un rejeton naîtra de ses racines. L'Esprit de l'Éternel reposera sur lui: Esprit de sagesse et d'intelligence, Esprit de conseil et de force, Esprit de connaissance et de crainte de l'Éternel."
traduction: Segond 1910
note: "Le serviteur doté de l’Esprit est le rejeton de Jessé, père de David : un Israélite."
themes:
  - jesus
