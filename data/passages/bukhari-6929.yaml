id: bukhari-6929
corpus: hadith
reference: Sahih al-Bukhari 6929
texte: "ʿAbd Allâh : c'est comme si je voyais le Prophète parler d'un des prophètes que son peuple avait battu et blessé ; il essuyait le sang de son visage en disant : « Seigneur ! Pardonne à mon peuple, car ils ne savent pas. »"
note: "Voir aussi Bukhari 3477. Écho de Lc 23,34 : « Père, pardonne-leur, car ils ne savent ce qu’ils font », prononcé sur la croix."
themes:
  - crucifixion
