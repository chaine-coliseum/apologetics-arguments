id: bereshit-rabbah-47-5
corpus: juif
reference: Bereshit Rabbah 47,5
texte: "« Et à l'égard d'Ismaël, je t'ai exaucé » — Rabbi Yoḥanan au nom de Rabbi Yehoshua ben Ḥanina : […] « Voici, je l'ai béni » : cela se réfère à Isaac. « Je le rendrai fécond » : cela se réfère à Isaac. « Je le multiplierai » : cela se réfère à Isaac. […] Rabbi Yitsḥaq : Ismaël ne produira que douze nesi’im, comme il est dit : « Des nuages (nesi’im) et du vent, mais pas de pluie » (Pr 25,14)."
themes:
  - muhammad-dans-la-bible
