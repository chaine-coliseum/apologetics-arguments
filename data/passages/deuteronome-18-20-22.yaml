id: deuteronome-18-20-22
corpus: bible
reference: Dt 18,20-22
texte: "Mais le prophète qui aura l'audace de dire en mon nom une parole que je ne lui aurai point commandé de dire, ou qui parlera au nom d'autres dieux, ce prophète-là sera puni de mort. Peut-être diras-tu dans ton cœur: Comment connaîtrons-nous la parole que l'Éternel n'aura point dite? Quand ce que dira le prophète n'aura pas lieu et n'arrivera pas, ce sera une parole que l'Éternel n'aura point dite. C'est par audace que le prophète l'aura dite: n'aie pas peur de lui."
traduction: Segond 1910
