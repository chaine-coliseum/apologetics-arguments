id: paraclet-pourquoi-muhammad-ne-cite-pas
question: Jésus a lu le rouleau d’Isaïe pour montrer que la prophétie parlait de lui (Lc 4,17-21). Pourquoi Muhammad n’a-t-il jamais cité le verset de Jean qui l’annoncerait ?
adressee_a: islam
objectif: Souligner l’absence de toute référence johannique dans le Coran.
