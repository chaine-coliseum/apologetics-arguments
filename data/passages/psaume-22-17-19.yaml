texte: Car des chiens m'environnent, Une bande de scélérats rôdent autour de moi, Ils ont percé mes mains et mes pieds. Je pourrais compter tous mes os. Eux, ils observent, ils me regardent; Ils se partagent mes vêtements, Ils tirent au sort ma tunique.
