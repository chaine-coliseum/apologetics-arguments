id: esaie-42-1-7
corpus: bible
reference: Es 42,1-7
texte: Voici mon serviteur, que je soutiendrai, Mon élu, en qui mon âme prend plaisir. J'ai mis mon esprit sur lui; Il annoncera la justice aux nations. Il ne criera point, il n'élèvera point la voix, Et ne la fera point entendre dans les rues. Il ne brisera point le roseau cassé, Et il n'éteindra point la mèche qui brûle encore; Il annoncera la justice selon la vérité. Il ne se découragera point et ne se relâchera point, Jusqu'à ce qu'il ait établi la justice sur la terre, Et que les îles espèrent en sa loi. […] Moi, l'Éternel, je t'ai appelé pour le salut, Et je te prendrai par la main, Je te garderai, et je t'établirai pour traiter alliance avec le peuple, Pour être la lumière des nations, Pour ouvrir les yeux des aveugles, Pour faire sortir de prison le captif, Et de leur cachot ceux qui habitent dans les ténèbres.
traduction: Segond 1910
themes:
  - muhammad-dans-la-bible
  - jesus
