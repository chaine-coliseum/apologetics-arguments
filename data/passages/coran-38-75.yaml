id: coran-38-75
corpus: coran
reference: Coran 38,75
texte: "(Allah) lui dit : « Ô Iblis, qui t'a empêché de te prosterner devant ce que J'ai créé de Mes mains ? T'enfles-tu d'orgueil ou te considères-tu parmi les hauts placés (al-ʿâlîn) ? »"
traduction: Hamidullah (Complexe Roi Fahd)
note: "Voir aussi 2,34 ; 7,11 ; 15,30-31 : l’ordre s’adresse aux anges, « excepté Iblis »."
themes:
  - allah
