id: coran-2-113
corpus: coran
reference: Coran 2,113
texte: "Et les Juifs disent : « Les Chrétiens ne tiennent sur rien », et les Chrétiens disent : « Les Juifs ne tiennent sur rien », alors qu'ils lisent le Livre !"
traduction: Hamidullah (Complexe Roi Fahd)
note: "« Ils lisent le Livre » : au VIIᵉ siècle, Juifs et chrétiens lisent un livre que le Coran considère comme le Livre."
themes:
  - falsification-de-la-bible
