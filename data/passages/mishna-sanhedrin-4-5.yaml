id: mishna-sanhedrin-4-5
corpus: juif
reference: Mishna, Sanhédrin 4,5
texte: "« La voix des sangs de ton frère crie. » Il n'est pas écrit « le sang de ton frère » mais « les sangs de ton frère » : le sien et celui de sa postérité. […] C'est pour cette raison que l'homme fut créé seul : pour enseigner que quiconque tue une seule âme, c'est comme s'il avait tué un monde entier, et quiconque sauve une seule âme, c'est comme s'il avait sauvé un monde entier."
note: Recueil juridique rabbinique (IIᵉ-IIIᵉ s.), non révélé. La variante « une âme d’Israël » des éditions imprimées est absente des manuscrits (A. Koller).
themes:
  - coran
