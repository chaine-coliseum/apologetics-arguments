id: deuteronome-18-15-19
corpus: bible
reference: Dt 18,15-19
texte: "L'Éternel, ton Dieu, te suscitera du milieu de toi, d'entre tes frères, un prophète comme moi: vous l'écouterez! Il répondra ainsi à la demande que tu fis à l'Éternel, ton Dieu, à Horeb, le jour de l'assemblée, quand tu disais: Que je n'entende plus la voix de l'Éternel, mon Dieu, et que je ne voie plus ce grand feu, afin de ne pas mourir. L'Éternel me dit: Ce qu'ils ont dit est bien. Je leur susciterai du milieu de leurs frères un prophète comme toi, je mettrai mes paroles dans sa bouche, et il leur dira tout ce que je lui commanderai. Et si quelqu'un n'écoute pas mes paroles qu'il dira en mon nom, c'est moi qui lui en demanderai compte."
traduction: Segond 1910
note: Le Dieu qui suscite le prophète est désigné par le tétragramme (YHWH). Le v. 15 précise « du milieu de toi » (miqqirbekha). Les v. 20-22 donnent les critères du faux prophète.
themes:
  - muhammad-dans-la-bible
