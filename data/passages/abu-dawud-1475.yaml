id: abu-dawud-1475
corpus: hadith
reference: Sunan Abi Dawud 1475
texte: "ʿUmar ibn al-Khaṭṭâb : « J'ai entendu Hishâm ibn Ḥakîm réciter la sourate al-Furqân autrement que je la récitais, alors que le Messager d'Allah me l'avait enseignée. […] Le Messager d'Allah dit : Ainsi a-t-elle été descendue. […] Le Coran a été descendu selon sept modes (aḥruf) ; récitez selon ce qui vous est le plus facile. »"
note: Voir aussi Abi Dawud 1477 (« que tu dises “Audient, Omniscient” ou “Puissant, Sage” ») et 1478 ; Bukhari 4992.
themes:
  - coran
